[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Linux targets are musl so the binaries are fully static: they run on Alpine
# and any glibc distro, and `vendored-tls` already links OpenSSL statically.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Features to pass to cargo build
features = ["vendored-tls"]
# Whether to install an updater program
install-updater = false
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./crates-io", "./npm"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# A GitHub repo to push Homebrew formulas to
tap = "Orbasker/homebrew-tap"
# Customize the Homebrew formula name
formula = "ltree2viz"

# Native ARM runner: cross-compiling for aarch64 Linux is not worth it.
[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
