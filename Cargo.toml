[package]
name = "ltree2viz"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "Turn a Postgres ltree table into a Mermaid diagram"
homepage = "https://github.com/Orbasker/ltree2viz"
repository = "https://github.com/Orbasker/ltree2viz"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["postgres", "ltree", "mermaid", "diagram", "cli"]
categories = ["command-line-utilities", "visualization"]

[features]
# Statically link OpenSSL so released binaries do not depend on the host libssl.
vendored-tls = ["native-tls/vendored"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
native-tls = "0.2.18"
postgres = "0.19.14"
postgres-native-tls = "0.5.3"
thiserror = "2.0.20"

[dev-dependencies]
insta = "1.48.0"

[lints.rust]
unsafe_code = "forbid"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
