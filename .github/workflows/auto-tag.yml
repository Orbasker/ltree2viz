name: Auto-tag release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT is required: tags pushed with the default GITHUB_TOKEN do not
          # trigger other workflows, so the Release workflow would never fire.
          token: ${{ secrets.RELEASE_PAT }}
      - name: Tag the Cargo.toml version if it isn't tagged yet
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"
          echo "Pushed ${tag}."
